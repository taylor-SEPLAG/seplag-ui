server {
    listen 80;

    server_name localhost;

    location = /seplagui {
        return 301 /seplagui/;
    }

    location /seplagui/ {
        alias /usr/share/nginx/html/seplagui/;
        try_files $uri $uri/ /seplagui/index.html;
    }

    error_page 404 /seplagui/index.html;

    location /nginx_status {
        stub_status on;  # Habilita o stub_status para monitoramento básico do Nginx
        allow 172.17.0.1; # Permite apenas solicitações de localhost
        deny all;        # Nega todas as outras solicitações
    }
}
